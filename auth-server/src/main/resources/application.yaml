server:
  port: 9000

spring:
  application:
    name: auth-server
  security:
    oauth2:
      authorizationserver:
        client:
          bank-xyz-client:
            registration:
              client-id: bank-xyz-client
              client-secret: "{noop}secret123"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - cuentas.read
                - cuentas.write
                - transacciones.read
                - transacciones.write
                - clientes.read
                - clientes.write