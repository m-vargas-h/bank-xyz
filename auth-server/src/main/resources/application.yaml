server:
  port: 9000

spring:
  application:
    name: auth-server
  security:
    oauth2:
      authorizationserver:
        client:
          bank-xyz-client:
            registration:
              client-id: bank-xyz-client
              client-secret: "{noop}${BANK_CLIENT_SECRET:secret123}"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - cuentas.read
                - cuentas.write
                - transacciones.read
                - transacciones.write
                - clientes.read
                - clientes.write
          bank-xyz-readonly:
            registration:
              client-id: bank-xyz-readonly
              client-secret: "{noop}${BANK_READONLY_SECRET:readonly123}"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - cuentas.read
                - transacciones.read
                - clientes.read