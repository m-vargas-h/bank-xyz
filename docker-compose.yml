x-ms-environment: &ms-environment
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
  # El issuer del token es el host con que se pide (localhost:9000), no el interno de Docker
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:9000
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bank_xyz}?serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

x-ms-depends-on: &ms-depends-on
  config-server:
    condition: service_healthy
  eureka-server:
    condition: service_healthy
  auth-server:
    condition: service_healthy
  kafka:
    condition: service_healthy
  mysql:
    condition: service_healthy

services:
  config-server:
    build: ./config-server
    container_name: bank-xyz-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/application/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eureka-server:
    build: ./eureka-server
    container_name: bank-xyz-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-server:
    build: ./auth-server
    container_name: bank-xyz-auth-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      BANK_CLIENT_SECRET: ${BANK_CLIENT_SECRET:-secret123}
      BANK_READONLY_SECRET: ${BANK_READONLY_SECRET:-readonly123}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/oauth2/jwks || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: bank-xyz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bank_xyz}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  batch:
    build: ./bank-xyz-batch
    container_name: bank-xyz-batch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bank_xyz}?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bank-xyz-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bank-xyz-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  bff:
    build: ./bank-xyz-bff
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      AUTH_TOKEN_URI: http://auth-server:9000/oauth2/token
      BANK_READONLY_SECRET: ${BANK_READONLY_SECRET:-readonly123}
      BANK_CLIENT_SECRET: ${BANK_CLIENT_SECRET:-secret123}
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:8443/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
      
  ms-cuentas:
    build: ./ms-cuentas
    container_name: bank-xyz-ms-cuentas
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment: *ms-environment
    depends_on: *ms-depends-on

  ms-transacciones:
    build: ./ms-transacciones
    container_name: bank-xyz-ms-transacciones
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment: *ms-environment
    depends_on: *ms-depends-on

  ms-clientes:
    build: ./ms-clientes
    container_name: bank-xyz-ms-clientes
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment: *ms-environment
    depends_on: *ms-depends-on

volumes:
  mysql-data: