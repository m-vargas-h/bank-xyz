services:
  config-server:
    build: ./config-server
    container_name: bank-xyz-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./eureka-server
    container_name: bank-xyz-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy

  auth-server:
    build: ./auth-server
    container_name: bank-xyz-auth-server
    ports:
      - "9000:9000"
    depends_on:
      eureka-server:
        condition: service_started

  ms-cuentas:
    build: ./ms-cuentas
    container_name: bank-xyz-ms-cuentas
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-transacciones:
    build: ./ms-transacciones
    container_name: bank-xyz-ms-transacciones
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-clientes:
    build: ./ms-clientes
    container_name: bank-xyz-ms-clientes
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started