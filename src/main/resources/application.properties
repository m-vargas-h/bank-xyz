spring.application.name=bank-xyz

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/bank_xyz?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Escalado batch
batch.thread-pool-size=3
batch.chunk-size=10

# BFF Security - usuarios por canal
bff.security.web.user=web_user
bff.security.web.password=web_pass_2024
bff.security.mobile.user=mobile_user
bff.security.mobile.password=mobile_pass_2024
bff.security.atm.user=atm_user
bff.security.atm.password=atm_pass_2024